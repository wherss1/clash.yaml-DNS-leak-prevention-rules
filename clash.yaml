    path: ./rules/Gemini.yaml

  Copilot:
    <<: *yaml_class
    url: "https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Copilot/Copilot.yaml"
    path: ./rules/Copilot.yaml

  proxy_list:
    <<: *yaml_domain
    url: "https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Proxy/Proxy_Domain.yaml"
    path: ./rules/Proxy_Domain.yaml

  gfw_list:
    <<: *text_class
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/ProxyGFWlist.list"
    path: ./rules/ProxyGFWlist.list

  reject_list:
    <<: *yaml_domain
    url: "https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./rules/reject.yaml

# ============================================================
